{% extends "base.html" %}
{% block titulo %}Entrar — Expedição Mogilar{% endblock %}
{% block corpo %}
<div class="entrar">
  <div class="marca grande"><span class="logo">M</span><span>Expedição <b>Mogilar</b></span></div>
  <form method="post" class="cartao">
    <h1>Entrar</h1>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <label>Usuário<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <button class="primario" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
